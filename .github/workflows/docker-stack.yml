version: '3.8'

services:
  php:
    image: yiisoftware/yii2-php:7.4-apache
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'  # Expose on 8000 internally; NGINX will talk to this
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
